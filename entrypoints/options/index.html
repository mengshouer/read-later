<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Open in a real tab rather than the embedded dialog on the browser's extensions page.
      That dialog's size is chosen by the browser and cannot be styled — it clipped the
      rules textarea and the storage panel to a ~340px column. WXT reads `manifest.*` meta
      tags on HTML entrypoints, so this becomes `options_ui.open_in_tab: true`.
    -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>Read Later settings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
